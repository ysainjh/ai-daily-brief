<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body{margin:0;background:#f3f4f6;font-family:Arial;}
.container{max-width:720px;margin:auto;padding:16px;}
.header{background:#111827;color:#fff;padding:20px;border-radius:12px;}
.card{background:#fff;margin-top:12px;border-radius:12px;overflow:hidden;}
.thumb{width:100%;height:200px;object-fit:cover;}
.content{padding:12px;}
.title{font-weight:600;margin-bottom:6px;}
.summary{color:#555;font-size:13px;}
.tag{font-size:12px;color:#4f46e5;}
a.button{display:inline-block;margin-top:8px;padding:6px 10px;background:#2563eb;color:#fff;text-decoration:none;border-radius:8px;}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h2>{{ title }}</h2>
  </div>

  <h3>🔥 Top 5</h3>
  {% for item in top5 %}
  <div class="card">
    <img class="thumb" src="{{ item.image }}">
    <div class="content">
      <div class="tag">⭐ {{ item.score }}/10</div>
      <div class="title">{{ item.title }}</div>
      <div class="summary">{{ item.summary }}</div>
      <a class="button" href="{{ item.link }}">阅读原文</a>
    </div>
  </div>
  {% endfor %}

  <h3>📰 全部新闻</h3>
  {% for section in sections %}
    {% for item in section["items"] %}
    <div class="card">
      <img class="thumb" src="{{ item.image }}">
      <div class="content">
        <div class="title">{{ item.title }}</div>
        <div class="summary">{{ item.summary }}</div>
      </div>
    </div>
    {% endfor %}
  {% endfor %}
</div>
</body>
</html>
