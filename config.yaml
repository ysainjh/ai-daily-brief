app:
  language: "zh-CN"
  timezone: "Asia/Shanghai"

email:
  subject_prefix: "每日简报"

briefs:
  - key: "daily_news"
    title: "每日要闻简报"
    subject_prefix: "每日要闻简报"
    to_env: "MAIL_TO"
    max_items_total: 14
    max_items_per_section: 7
    fallback_why: "与全球或国内局势变化有关，值得跟进。"
    sections:
      - name: "世界重要新闻"
        max_items: 7
        feeds:
          - "https://news.google.com/rss/headlines/section/topic/WORLD?hl=zh-CN&gl=CN&ceid=CN:zh-Hans"
          - "https://news.google.com/rss/search?q=%E5%9B%BD%E9%99%85%20%E6%94%BF%E6%B2%BB%20%E7%BB%8F%E6%B5%8E%20%E5%A4%96%E4%BA%A4%20when:1d&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"
          - "https://news.google.com/rss/search?q=world%20news%20geopolitics%20economy%20diplomacy%20when:1d&hl=en-US&gl=US&ceid=US:en"
      - name: "国内重要新闻"
        max_items: 7
        feeds:
          - "https://news.google.com/rss/headlines/section/topic/NATION?hl=zh-CN&gl=CN&ceid=CN:zh-Hans"
          - "https://news.google.com/rss/search?q=%E4%B8%AD%E5%9B%BD%20%E6%97%B6%E6%94%BF%20%E7%BB%8F%E6%B5%8E%20%E6%B0%91%E7%94%9F%20when:1d&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"
          - "https://news.google.com/rss/search?q=China%20policy%20economy%20society%20when:1d&hl=en-US&gl=US&ceid=US:en"

  - key: "primary_math_education"
    title: "小学数学教育热点简报"
    subject_prefix: "小学数学教育热点简报"
    to: "18513544886@163.com"
    max_items_total: 14
    max_items_per_section: 5
    fallback_why: "与小学数学教学、融合教育或 AI 教育实践有关，值得关注。"
    editorial_prompt: "你是给中国小学数学教师和教育从业者写每日教育新闻简报的中文编辑。请把新闻标题、摘要和关注理由改写成自然、克制、准确的简体中文，突出小学数学教学、义务教育新课标、融合教育、特殊教育、AI 教育、教育数字化、课堂教学与教师发展等角度。人名、机构名、政策名、产品名、模型名等专有名词不要硬翻译。不要夸张，不要编造 RSS 没有提供的信息。只输出 JSON。"
    sections:
      - name: "小学数学教育热点"
        max_items: 5
        feeds:
          - "https://news.google.com/rss/search?q=%E5%B0%8F%E5%AD%A6%E6%95%B0%E5%AD%A6%20%E6%95%99%E8%82%B2%20%E6%95%99%E5%AD%A6%20when:7d&hl=zh-CN&gl=CN&ceid=CN:zh-Hans"
